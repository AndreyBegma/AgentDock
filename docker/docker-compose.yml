name: agentdock

services:
  postgres:
    image: postgres:16.5-alpine@sha256:0366402213df5db03c47ff80bcc697e92c8be0c213d03c941df1fc42d1ba9560
    container_name: agentdock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bun run db:setup or set it in docker/.env}
      POSTGRES_DB: agentdock
    ports:
      - "127.0.0.1:5421:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BullMQ backend for cron schedules (ADR-0015). AOF keeps pending timers over
  # a restart; `noeviction` is required by BullMQ. Not backed up: PostgreSQL is
  # the source of truth and the reconciler rebuilds lost timers.
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: agentdock-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run bun run db:setup or set it in docker/.env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?run bun run db:setup or set it in docker/.env}
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6421:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

# Pinned names: Docker would otherwise prefix them with the compose project
# name, so renaming the project (`name:` above) would start with empty volumes.
# These are the names the volumes have had since the project was `agentdock`.
volumes:
  postgres_data:
    name: agentdock_postgres_data
  redis_data:
    name: agentdock_redis_data
