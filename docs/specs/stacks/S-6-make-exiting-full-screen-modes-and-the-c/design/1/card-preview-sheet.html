<!doctype html>
<html lang="en" data-theme="dark" data-scale="desk" data-palette="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card preview sheet — phone</title>
<style>
:root{--font-sans:'SF Pro Text',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--radius-control:6px;--radius-surface:8px;--size-tap:44px;--dur-fast:100ms;--ease-sheet:cubic-bezier(.32,.72,0,1)}
:root,:root[data-theme="dark"]{color-scheme:dark;--color-ground:#0a1022;--color-surface:#111a33;--color-raised:#18223f;--color-content:rgb(27 38 71/.96);--color-scrim:rgb(10 16 34/.3);--color-ink:#f2f2f6;--color-ink-2:rgb(242 242 246/.62);--color-ink-3:rgb(242 242 246/.53);--color-line:rgb(255 255 255/.1);--color-line-strong:rgb(255 255 255/.18);--color-hover:rgb(255 255 255/.06);--color-focus:#b4b2ff;--color-accent:#5b5bf6;--color-on-accent:#fff;--color-accent-soft:rgb(91 91 246/.2);--color-accent-ink:#b4b2ff;--hue-1:#5b9cf6;--hue-1-soft:rgb(91 156 246/.18);--hue-1-ink:#a4c8ff;--hue-2:#2fbf94;--hue-2-soft:rgb(47 191 148/.18);--hue-2-ink:#7ee0c0;--hue-4:#e69f00;--hue-4-soft:rgb(230 159 0/.18);--hue-4-ink:#f5c25c;--hue-7:#a68bfa;--glass-sheen:rgb(255 255 255/.06);--glass-scrim-strong:rgb(9 9 12/.64);--glass-brightness-strong:.7;--glass-edge:rgb(255 255 255/.14);--glass-spec:rgb(255 255 255/.2);--glass-rim-strong:rgb(242 242 246/.22);--glass-rim-shade-strong:rgb(9 9 12/.2);--glass-meniscus:rgb(9 9 12/.55);--glass-refract:rgb(242 242 246/.35);--glass-shadow-strong:rgb(0 0 0/.45);--glass-shadow-clear:rgb(0 0 0/.15);--canvas-glow:18%}
:root[data-theme="light"]{color-scheme:light;--color-ground:#fff;--color-surface:#f8faff;--color-raised:#f0f4fb;--color-content:rgb(255 255 255/.96);--color-scrim:rgb(10 16 34/.22);--color-ink:#18181b;--color-ink-2:rgb(24 24 27/.72);--color-ink-3:rgb(24 24 27/.64);--color-line:rgb(0 0 0/.1);--color-line-strong:rgb(0 0 0/.23);--color-hover:rgb(0 0 0/.06);--color-focus:#4f46e5;--color-accent:#4f46e5;--color-on-accent:#fff;--color-accent-soft:rgb(79 70 229/.12);--color-accent-ink:#4338ca;--hue-1:#1f64d6;--hue-1-soft:rgb(31 100 214/.12);--hue-1-ink:#1550b0;--hue-2:#00805e;--hue-2-soft:rgb(0 128 94/.12);--hue-2-ink:#006a4e;--hue-4:#b36b00;--hue-4-soft:rgb(179 107 0/.12);--hue-4-ink:#8a5200;--hue-7:#7244e0;--glass-sheen:rgb(0 0 0/.06);--glass-scrim-strong:rgb(255 255 255/.64);--glass-brightness-strong:1.3;--glass-edge:rgb(0 0 0/.18);--glass-spec:rgb(0 0 0/.2);--glass-rim-strong:rgb(255 255 255/.3);--glass-rim-shade-strong:rgb(24 24 27/.08);--glass-meniscus:rgb(24 24 27/.12);--glass-refract:rgb(255 255 255/.5);--glass-shadow-strong:rgb(0 0 0/.16);--glass-shadow-clear:rgb(0 0 0/.08);--canvas-glow:10%}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--color-ground);color:var(--color-ink)}
body{margin:0;min-height:100vh;font:14px/20px var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.canvas{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 50vmax at 10% 0%,color-mix(in oklab,var(--hue-1) var(--canvas-glow),transparent),transparent 70%),radial-gradient(50vmax 45vmax at 95% 35%,color-mix(in oklab,var(--hue-7) var(--canvas-glow),transparent),transparent 70%)}
.icon{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glass-strong{background:linear-gradient(var(--glass-sheen),var(--glass-sheen)),var(--glass-scrim-strong);backdrop-filter:blur(40px) saturate(180%) brightness(var(--glass-brightness-strong));-webkit-backdrop-filter:blur(40px) saturate(180%) brightness(var(--glass-brightness-strong));border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-spec),inset 1px 1px 0 var(--glass-rim-strong),inset -1px -1px 0 var(--glass-rim-shade-strong),inset 0 -3px 3px -1px var(--glass-meniscus),inset 0 0 18px -4px var(--glass-refract),0 20px 48px var(--glass-shadow-strong)}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:4px}
.mono{font-family:var(--font-mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:28px;padding:0 12px;border-radius:var(--radius-control);font:600 13px/1 var(--font-sans);border:1px solid var(--color-line-strong);background:var(--color-raised);color:var(--color-ink);cursor:pointer}
.theme{position:fixed;top:16px;right:16px;z-index:100}
.page{max-width:1240px;margin:0 auto;padding:32px 24px 48px}
.eyebrow{font-size:12px;font-weight:500;color:var(--color-ink-3)}
h1{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.desc{max-width:72ch;color:var(--color-ink-2);margin-top:6px}
.stage{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;margin-top:28px}
figure{margin:0;display:flex;flex-direction:column;gap:12px;width:360px}
figcaption{font-size:12px;line-height:17px;color:var(--color-ink-3)}
figcaption b{display:block;font-size:13px;color:var(--color-ink);font-weight:600;margin-bottom:2px}
.phone{position:relative;width:360px;height:740px;border-radius:40px;overflow:hidden;background:var(--color-surface);border:1px solid var(--color-line-strong);box-shadow:0 30px 60px -20px var(--glass-shadow-strong)}
.sb{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 26px;font:600 14px/1 var(--font-sans)}
.home{position:absolute;left:50%;bottom:8px;width:120px;height:5px;margin-left:-60px;border-radius:99px;background:var(--color-ink);opacity:.8;z-index:70}
.bb{position:absolute;left:10px;right:10px;bottom:22px;z-index:66;display:flex;align-items:center;gap:6px;height:60px;padding:7px;border-radius:22px}
.bb-back{display:inline-flex;align-items:center;gap:4px;height:44px;min-width:44px;padding:0 16px 0 10px;border-radius:15px;border:1px solid var(--color-line-strong);background:var(--color-raised);color:var(--color-ink);font:600 15px/1 var(--font-sans);cursor:pointer;transition:transform var(--dur-fast) var(--ease-sheet)}
.bb-back:active{transform:scale(.97)}
.bb-back .icon{width:22px;height:22px}
.grow{flex:1}
.bb-act.solid{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:15px;border:0;background:var(--color-accent);color:var(--color-on-accent);font:600 15px/1 var(--font-sans);cursor:pointer}
.bb-act .icon{width:18px;height:18px}
/* board behind */
.board{display:flex;gap:10px;padding:8px 12px;overflow:hidden}
.col{width:250px;flex-shrink:0;padding:8px;border-radius:8px;background:var(--color-hover);display:flex;flex-direction:column;gap:8px}
.col h4{margin:0;font-size:13px;font-weight:600;padding:2px 4px}
.bc{padding:10px 12px;border-radius:6px;background:var(--color-content);border:1px solid var(--color-line);font-weight:500;font-size:14px}
.bc small{display:block;margin-top:4px;font:12px/16px var(--font-mono);color:var(--color-ink-3)}
.bc.sel{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent)}
.scrim{position:absolute;inset:0;z-index:62;background:var(--color-scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:var(--top,190px);z-index:64;border-radius:24px 24px 0 0;padding:0 18px 120px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.grab{align-self:center;display:grid;place-items:center;width:88px;height:28px;border:0;background:transparent;cursor:grab}
.grab i{width:40px;height:5px;border-radius:99px;background:var(--color-ink-3)}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-ink-3)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--hue-1)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;font-size:10px;font-weight:600;background:var(--hue-4-soft);color:var(--hue-4-ink)}
.st{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--hue-2-soft);color:var(--hue-2-ink)}
.pill i{width:8px;height:8px;border-radius:99px;background:var(--hue-2)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0;font-size:14px}
dt{color:var(--color-ink-3)}dd{margin:0}
.para{color:var(--color-ink-2);font-size:14px}
.hint{position:absolute;z-index:80;font:600 11px/1 var(--font-sans);padding:6px 8px;border-radius:999px;background:var(--color-accent);color:var(--color-on-accent);white-space:nowrap}
</style>
</head>
<body>
<div class="canvas"></div>
<button class="btn theme" type="button" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Toggle theme</button>
<main class="page">
<div class="eyebrow">S-6 · C-280</div>
<h1>Card preview sheet</h1>
<p class="desc">On phones the preview opens as a bottom sheet over the board. There are three ways to close it, each one movement: tap <b>Close</b> in the bar, tap the dimmed board, or drag the grabber down. Open card is the sheet's one solid action, on the opposite side from Close.</p>
<div class="stage">
  <figure>
    <div class="phone">
      <div class="sb"><span>9:41</span><span class="mono" style="font-size:12px">5G ▮▮▮</span></div>
      <div class="board" aria-hidden="true">
        <div class="col"><h4>Ready · 2</h4><div class="bc sel">Board checkbox inside card<small>#596</small></div><div class="bc">Accept photos in /new<small>#594</small></div></div>
        <div class="col"><h4>In progress · 1</h4><div class="bc">Discuss mode<small>#590</small></div></div>
      </div>
      <div class="scrim" aria-hidden="true"></div>
      <section class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="pv-t">
        <button class="grab" type="button" aria-label="Close preview"><i></i></button>
        <div class="meta"><span class="sw"></span>AgentDock<span class="mono">#596</span><span class="tag">feat</span></div>
        <h2 class="st" id="pv-t">Board checkbox inside card</h2>
        <span class="pill"><i></i>Running · slot-1</span>
        <dl><dt>Branch</dt><dd class="mono" style="font-size:12px">fix/596-board-checkbox</dd><dt>Started</dt><dd>14:02 · 38 min ago</dd><dt>Cost</dt><dd>$3.14</dd></dl>
        <p class="para">The checkbox in a card tile toggles the card's ready state without opening the preview. Keyboard and screen-reader users reach it as a separate control.</p>
      </section>
      <div class="bb glass-strong">
        <button class="bb-back" type="button" aria-label="Close preview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span>Close</span></button>
        <span class="grow"></span>
        <button class="bb-act solid" type="button">Open card<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></button>
      </div>
      <span class="hint" style="top:130px;left:120px">tap to close</span>
      <span class="hint" style="top:200px;left:232px">drag down</span>
      <div class="home"></div>
    </div>
    <figcaption><b>Open (peek, about 75% of the height)</b>The bar is pinned to the sheet's bottom edge, so it stays in reach while the body scrolls. Focus returns to the board card it came from.</figcaption>
  </figure>
  <figure>
    <div class="phone">
      <div class="sb"><span>9:41</span><span class="mono" style="font-size:12px">5G ▮▮▮</span></div>
      <div class="board" aria-hidden="true">
        <div class="col"><h4>Ready · 2</h4><div class="bc sel">Board checkbox inside card<small>#596</small></div><div class="bc">Accept photos in /new<small>#594</small></div></div>
      </div>
      <div class="scrim" aria-hidden="true" style="opacity:.5"></div>
      <section class="sheet glass-strong" style="--top:430px" role="dialog" aria-modal="true" aria-labelledby="pv-t2">
        <button class="grab" type="button" aria-label="Close preview"><i style="background:var(--color-accent)"></i></button>
        <div class="meta"><span class="sw"></span>AgentDock<span class="mono">#596</span></div>
        <h2 class="st" id="pv-t2">Board checkbox inside card</h2>
      </section>
      <div class="bb glass-strong" style="opacity:.6">
        <button class="bb-back" type="button" aria-label="Close preview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span>Close</span></button>
        <span class="grow"></span>
        <button class="bb-act solid" type="button">Open card</button>
      </div>
      <div class="home"></div>
    </div>
    <figcaption><b>Dragging down</b>The sheet follows the finger and the scrim fades with it. Released past 30% of the sheet's height, or with a fast flick, it closes (260&thinsp;ms, sheet easing). Otherwise it springs back.</figcaption>
  </figure>
</div>
</main>
</body>
</html>
