# AgentDock staging (ADR-0016) — https://staging-agentdock.luna-realm.com
#
# Lives in /home/archi/stacks/agentdock-staging on the Woodpecker agent host,
# copied there by refresh.sh; it is not a git checkout. The images are built
# on the same Docker daemon by build-staging.sh (tag :staging) — no registry.
#
# NOTHING IS PUBLISHED: there is no `ports:` entry. Traffic arrives through the
# Cloudflare tunnel (cloudflared below, remote-managed, one public hostname →
# http://proxy:80). Caddy splits it: /api/* → api (prefix stripped, WebSockets
# included: /api/live, /api/terminal, /api/runner), everything else → web.

name: agentdock-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  postgres:
    image: postgres:16.5-alpine@sha256:0366402213df5db03c47ff80bcc697e92c8be0c213d03c941df1fc42d1ba9560
    container_name: agentdock-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: agentdock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging
    networks: [staging]

  # BullMQ backend (ADR-0015). AOF keeps pending timers over a restart.
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: agentdock-staging-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set it in .env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set it in .env}
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *logging
    networks: [staging]

  # Migrates and seeds in its entrypoint before it listens.
  api:
    image: agentdock-api:staging
    container_name: agentdock-staging-api
    restart: unless-stopped
    env_file: ./env/api.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/agentdock?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # #309, ADR-0031: board card attachments. Back it up with the database.
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g
    logging: *logging
    networks: [staging]

  web:
    image: agentdock-web:staging
    container_name: agentdock-staging-web
    restart: unless-stopped
    # Read at runtime by server components (current-user.ts), not only by the
    # build-time /api rewrite: without it they call localhost:8180.
    environment:
      API_URL: http://api:8180
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 512m
    logging: *logging
    networks: [staging]

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: agentdock-staging-proxy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    mem_limit: 128m
    logging: *logging
    networks: [staging]

  # Token-based, remote-managed tunnel `agentdock-staging`: the public hostname
  # and its target (http://proxy:80) are set in the Zero Trust dashboard.
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1@sha256:4604b477520dc8322af5427da68b44f0bf814938e9d2e4814f2249ee4b03ffdf
    container_name: agentdock-staging-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: ./env/cloudflared.env
    depends_on:
      proxy: { condition: service_started }
    mem_limit: 128m
    logging: *logging
    networks: [staging]

volumes:
  pgdata:
  redis:
  attachments:

networks:
  staging:
    driver: bridge
