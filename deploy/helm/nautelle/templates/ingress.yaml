{{- if .Values.ingress.enabled -}}
{{- $fullname := include "nautelle.fullname" . -}}
{{- $host := include "nautelle.ingressHost" . -}}
{{- $tls := .Values.ingress.tls -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "nautelle.labels" (dict "root" . "component" "proxy") | nindent 4 }}
  {{- if or .Values.ingress.annotations (and $tls.enabled (or $tls.certManager.clusterIssuer $tls.certManager.issuer)) }}
  annotations:
    {{- if $tls.enabled }}
    {{- with $tls.certManager.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with $tls.certManager.issuer }}
    cert-manager.io/issuer: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
  # One rule: the proxy splits /api from the web app, as in the compose install.
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
