{{- include "nautelle.validate" . -}}
{{- $fullname := include "nautelle.fullname" . -}}
{{- $needPostgres := and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
{{- $needRedis := and .Values.redis.enabled (not .Values.redis.auth.existingSecret) -}}
{{- if or $needPostgres $needRedis }}
{{- /* A generated password is generated once: an upgrade reads it back. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "nautelle.bundledSecret" .)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nautelle.bundledSecret" . }}
  labels:
    {{- include "nautelle.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    # Deleting the release keeps it: the database volume still needs it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $needPostgres }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | default (get $existing "postgres-password") | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
  {{- if $needRedis }}
  redis-password: {{ .Values.redis.auth.password | b64enc | default (get $existing "redis-password") | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
{{- end }}
{{- if or (and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret)) (and (not .Values.redis.enabled) .Values.externalRedis.url (not .Values.externalRedis.existingSecret)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nautelle.externalSecret" . }}
  labels:
    {{- include "nautelle.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) }}
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  {{- end }}
{{- end }}
{{- if .Values.tunnel.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nautelle.tunnelSecret" . }}
  labels:
    {{- include "nautelle.labels" (dict "root" . "component" "proxy") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tunnel.existingSecretKey }}: {{ .Values.tunnel.token | quote }}
{{- end }}
