name: Bug report
description: Something in Nautelle or its runner does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first and check that you run the latest release.
        Do not report a security vulnerability here: use the private link on the issue chooser or see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nautelle version
      description: A release tag such as v1.2.3, or a commit SHA if you run from source.
    validations:
      required: true
  - type: input
    id: runner-version
    attributes:
      label: Runner version
      description: Output of `nautelle-runner --version`. Write "not involved" if the bug is not about a runner.
    validations:
      required: true
  - type: dropdown
    id: runner-install
    attributes:
      label: How the runner was installed
      options:
        - Homebrew
        - npm
        - Built from source
        - Not involved
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system of the runner or server host
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: Fedora 44 x86_64, macOS 15 arm64, ...
  - type: dropdown
    id: install-mode
    attributes:
      label: How Nautelle is deployed
      options:
        - One-command install (published images)
        - From source (bun run start:dev)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Redact tokens, keys and private paths first.
      render: shell
