# Publishes the Nautelle images and the GitHub Release (ADR-0088, ADR-0091).
#
# Pushing the tag vX.Y.Z on main (ADR-0071) builds ghcr.io/andreybegma/
# nautelle-api and nautelle-web for linux/amd64 and linux/arm64, pushes them as
# :X.Y.Z, :X.Y, :X and :latest with an SBOM and provenance, signs them with
# cosign, and creates the vX.Y.Z GitHub Release from docs/releases/vX.Y.Z.md
# with the install command, the image digests and the runner version. The
# public install (deploy/compose/) pulls the images. The tag must equal
# APP_VERSION; deploy/images/release-images.sh refuses anything else.
#
# A manual run is a dry run: it builds both images for both platforms and
# pushes, signs and releases nothing. It starts only when the message given to
# the manual run contains [image-release] (the gate reads the message, as
# release-runner.yml explains). Rehearse on a branch other than develop: a
# manual run on develop also deploys staging through pipeline.yml.
