#
# Pull requests never run this workflow (ADR-0053). The gating in this file is
# not the security boundary: whoever pushes a commit can edit it. The boundary
# is in settings a pusher cannot change (deploy/README.md): the secrets
# ghcr_token, cosign_private_key, cosign_password and github_release_token are
# restricted to the tag event only, never manual, and v* tags are protected by
# a GitHub ruleset and cut from main. Each build runs with --pull, the
# Dockerfiles pin their bases by digest, and the build tooling (buildkit,
# binfmt, the SBOM scanner, cosign) is pinned in release-images.sh.

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual
    evaluate: 'CI_COMMIT_MESSAGE contains "[image-release]"'

variables:
  - &ci_image agentdock-ci:node-bun
  - &docker_image docker:28-cli
  - &helm_image alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
  - &socket
    - /var/run/docker.sock:/var/run/docker.sock
  - &publish_when
    - event: tag
      ref: refs/tags/v*

steps:
  # The same image pipeline.yml builds; built here too, so this workflow does
  # not depend on another one (pipeline.yml does not run on tags).
  - name: ci-image
    image: *docker_image
    when: *publish_when
    volumes: *socket
    commands:
      - docker build --pull -t agentdock-ci:node-bun deploy/ci-image

  - name: images
    image: *docker_image
    when: *publish_when
    volumes: *socket
    environment:
      GHCR_USER: andreybegma
      GHCR_TOKEN:
        from_secret: ghcr_token
      COSIGN_PRIVATE_KEY:
        from_secret: cosign_private_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
    commands:
      - sh deploy/images/release-images.sh

  # The body comes from the release note and the digests images wrote to
  # .release/images.json. A re-run edits the release instead of failing.
  - name: github-release
    image: *ci_image
    when: *publish_when
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - if [ "$${NAUTELLE_IMAGES_DRY_RUN:-}" = 1 ]; then echo 'dry run, not releasing'; exit 0; fi
      - sh apps/runner/scripts/install-gh.sh
      - bun scripts/release-notes.ts "$${CI_COMMIT_TAG}" .release/notes.md
      - version=$${CI_COMMIT_TAG#v}
      - case "$${version}" in *-*) kind=--prerelease ;; *) kind=--latest ;; esac
      - |
        if gh release view "$${CI_COMMIT_TAG}" --repo AndreyBegma/Nautelle >/dev/null 2>&1; then
          gh release edit "$${CI_COMMIT_TAG}" --repo AndreyBegma/Nautelle \
            --title "Nautelle $${CI_COMMIT_TAG}" --notes-file .release/notes.md "$${kind}"
        else
          gh release create "$${CI_COMMIT_TAG}" --repo AndreyBegma/Nautelle --verify-tag \
            --title "Nautelle $${CI_COMMIT_TAG}" --notes-file .release/notes.md "$${kind}"
        fi

  # No tag and no secret: builds both images for both platforms and stops
  # before the push.
  - name: images-dry-run
    image: *docker_image
    when:
      - event: manual
    volumes: *socket
    commands:
      - sh deploy/images/release-images.sh

  # The Helm chart at the same version, once its images are pushed
  # (ADR-0091). No socket: helm talks to the registry itself.
  - name: chart
    image: *helm_image
    depends_on: [images]
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      GHCR_USER: andreybegma
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - sh deploy/helm/release-chart.sh

  # Packages <APP_VERSION>-dev and pushes nothing.
  - name: chart-dry-run
    image: *helm_image
    depends_on: []
    when:
      - event: manual
    commands:
      - sh deploy/helm/release-chart.sh
