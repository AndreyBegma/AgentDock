# AgentDock CI and staging (ADR-0016, ADR-0018).
#
# `check` (Biome) and `build` run in full on every pipeline. `test` depends on
# the event:
#   - pull request: only the packages changed since the merge base with the
#     target branch, plus their dependents (turbo `--filter=...[base]`). The
#     full suite runs instead when a root file every package depends on
#     changed, or when the merge base cannot be found. The step prints which
#     mode it took.
#   - push to main, manual run: the full suite.
#   - push to develop: no tests. The pull request already ran them, and there
#     is no production yet (ADR-0018).
# A pull request that changes only docs (docs/**, *.md, .github/**) skips
# `build` and `test`. `check` still runs, so it still reports a status.
#
# A push to develop then builds the staging images on the agent host's Docker
# daemon and replaces the containers of /home/archi/stacks/agentdock-staging
# (https://staging-agentdock.luna-realm.com). No registry, no ssh: the agents
# run on the staging host, and the steps that need it get the Docker socket.
#
# Trust levels (ADR-0053). A pull request is untrusted: it runs the pipeline
# file and the build scripts of its own branch, and anyone who can push a
# branch, a card worker included, can open one. So a step that can run on a
# pull request gets no Docker socket, no host volume and no secret.
#   - `ci-image`, `build-staging` and `deploy-staging` mount the socket and run
#     on push and manual events only. A pull request runs on the
#     agentdock-ci:node-bun image the last push built; a change to
#     deploy/ci-image/ reaches CI once it is merged. (Not by digest: the image
#     never leaves the host, and a local image has no repository digest.)
#   - No step mounts a host cache. bun's install cache lives in the step's
#     container, turbo's in the pipeline's workspace; both die with the
#     pipeline, so nothing one pipeline writes is reused by another, a release
#     or a staging build in particular.
# scripts/check-ci.ts (`bun run check`) fails when a step that can run on a
# pull request mounts a volume or reads a secret. It guards against mistakes;
# a pull request can edit it too. Until pull requests run on an agent without
# the Docker socket, a same-repository pull request that edits this file can
# still reach it: only forks wait for approval (#504). That gap is open and
# recorded in ADR-0053 §7 and deploy/README.md.
#
# The CI Postgres holds throwaway data. It runs on tmpfs, with fsync,
# synchronous_commit and full_page_writes off.
#
# The repository is public. The socket and staging mounts need it
# "trusted → volumes" in Woodpecker, and pull requests from forks must wait
# for approval (require_approval: forks). Pull requests from the repository's
# own branches, board cards' included, start at once (#504); pull_requests or
# all_events would gate them too. deploy/README.md lists the repository
# settings.

when:
  - event: pull_request
  - event: push
    branch: [develop, main]
  - event: manual

variables:
  - &ci_image agentdock-ci:node-bun
  - &docker_image docker:28-cli
  - &socket
    - /var/run/docker.sock:/var/run/docker.sock
  # The stack directory at the host's own path, so the compose file's relative
  # paths mean the same thing inside the step as they do to the daemon.
  - &socket_and_staging
    - /var/run/docker.sock:/var/run/docker.sock
    - /home/archi/stacks/agentdock-staging:/home/archi/stacks/agentdock-staging
  # turbo's cache in the workspace (.turbo/cache, its default) is shared by the
  # steps of one pipeline and dies with it.
  - &turbo_env
    TURBO_TELEMETRY_DISABLED: '1'
  # A pull request that touches only these skips `build` and `test`.
  - &docs_only
    exclude: ['docs/**', '**/*.md', '.github/**']

services:
  # Throwaway data: no durability. tmpfs is an undocumented step/service field
  # in Woodpecker 3.18, mapped to the docker backend's HostConfig.Tmpfs. It
  # needs "trusted → volumes", like the host mounts below.
  - name: postgres
    image: postgres:16.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: agentdock
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    commands:
      - docker-entrypoint.sh postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
  - name: redis
    image: redis:7.4.11-alpine
    commands:
      - redis-server --requirepass ci --maxmemory-policy noeviction

steps:
  # Never on a pull request: the socket is root on the host (ADR-0053).
  - name: ci-image
    image: *docker_image
    when:
      - event: [push, manual]
    volumes: *socket
    commands:
      - docker build --pull -t agentdock-ci:node-bun deploy/ci-image

  # Secrets in the commits the clone holds, with .gitleaks.toml: the scan
  # `bun run check:secrets` runs. The oldest commit of a shallow clone shows
  # its whole tree, so the tree is scanned too. --redact keeps a value it finds
  # out of the log, which is public. It reads only the clone and needs no
  # other step. Keep the image in step with scripts/check-secrets.sh.
  - name: secrets
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    depends_on: []
    commands:
      - gitleaks git --no-banner --redact --config .gitleaks.toml .

  - name: install
    image: *ci_image
    depends_on: [{ name: ci-image, optional: true }]
    environment: *turbo_env
    commands:
      - bun --version
      - bun install --frozen-lockfile
      - bun run db:generate

  - name: check
    image: *ci_image
    depends_on: [install]
    commands:
      - bun run check

  # `next build` skips test files and `bun test` does not type-check, so a
  # stale fixture only shows up here. Turbo builds `shared` first.
  - name: typecheck
    image: *ci_image
    depends_on: [install]
    when:
      - event: pull_request
        path: *docs_only
      - event: [push, manual]
    environment: *turbo_env
    commands:
      - bun run typecheck --filter=@nautelle/web

  - name: build
    image: *ci_image
    depends_on: [install]
    when:
      - event: pull_request
        path: *docs_only
      - event: [push, manual]
    environment: *turbo_env
    commands:
      - bun run build -- --concurrency=2
      # C-295: no user-visible "AgentDock" in what the web app serves.
      - bun scripts/check-brand.ts --web

  # `$$` keeps a variable from Woodpecker's own substitution, so the shell
  # expands it.
  - name: test
    image: *ci_image
    depends_on: [build]
    when:
      - event: pull_request
        path: *docs_only
      - event: push
        branch: main
      - event: manual
    environment:
      <<: *turbo_env
      TEST_DATABASE_URL: postgresql://postgres:ci@postgres:5432/agentdock_test?schema=public
      TEST_REDIS_URL: redis://:ci@redis:6379/1
      DATABASE_URL: postgresql://postgres:ci@postgres:5432/agentdock?schema=public
      APP_ENV: test
    commands:
      - until node -e "require('net').connect(5432,'postgres').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; do sleep 1; done
      - (cd apps/api && node -e "const c=new (require('pg').Client)({connectionString:'postgresql://postgres:ci@postgres:5432/agentdock'});c.connect().then(()=>c.query(\"select name, setting from pg_settings where name in ('fsync','synchronous_commit','full_page_writes')\")).then(r=>{for(const s of r.rows)console.log('postgres '+s.name+'='+s.setting);return c.end()})")
      # A shallow clone has no merge base: fetch the target branch's history
      # (commits only, no trees). Any failure means the full suite, never none.
      - |
        FILTER=""
        if [ "$${CI_PIPELINE_EVENT}" = pull_request ]; then
          TARGET="$${CI_COMMIT_TARGET_BRANCH:-develop}"
          UNSHALLOW=""
          [ "$$(git rev-parse --is-shallow-repository)" = true ] && UNSHALLOW=--unshallow
          if git fetch --no-tags --quiet $${UNSHALLOW} --filter=tree:0 origin "+refs/heads/$${TARGET}:refs/remotes/origin/$${TARGET}" \
            && BASE="$$(git merge-base HEAD "origin/$${TARGET}")"; then
            ROOT="$$(git diff --name-only "$${BASE}" HEAD | grep -E '^(package\.json|bun\.lock|turbo\.json|tsconfig\.json|biome\.json|\.woodpecker/|deploy/ci-image/)' || true)"
            if [ -n "$${ROOT}" ]; then
              echo "test mode: full (root files changed since $${BASE}:" $${ROOT} ")"
            else
              FILTER="--filter=...[$${BASE}]"
              echo "test mode: affected (packages changed since merge base $${BASE} with origin/$${TARGET}, and their dependents)"
            fi
          else
            echo "test mode: full (no merge base with origin/$${TARGET})"
          fi
        else
          echo "test mode: full ($${CI_PIPELINE_EVENT} event)"
        fi
        bun run test $${FILTER}

  # On a push to develop `test` is filtered out and the optional dependency is
  # dropped. On a manual run, the deploy waits for the full suite.
  - name: build-staging
    image: *docker_image
    depends_on: [check, typecheck, build, { name: test, optional: true }]
    when:
      - event: push
        branch: develop
      - event: manual
        branch: develop
    volumes: *socket
    commands:
      - sh deploy/staging/build-staging.sh

  - name: deploy-staging
    image: *docker_image
    depends_on: [build-staging]
    when:
      - event: push
        branch: develop
      - event: manual
        branch: develop
    volumes: *socket_and_staging
    commands:
      - sh deploy/staging/refresh.sh
