# Releases nautelle-runner (ADR-0017).
#
# Pushing the tag runner-v<version> builds the four binaries, signs SHA256SUMS
# (ADR-0049), creates the GitHub Release with the tarballs, SHA256SUMS and
# SHA256SUMS.sig, publishes the npm packages
# (the four platform packages before the wrapper, then the deprecated
# agentdock-runner, ADR-0073) and pushes the Homebrew formula to
# AndreyBegma/homebrew-tap. The tag must equal the version in
# apps/runner/package.json; build-release.sh refuses anything else.
#
# A manual run is a dry run: it builds and stops before every publish step.
# It starts only when the message given to the manual run contains
# [runner-release], so a plain manual run of pipeline.yml does not start one
# too. The gate reads the message, not a variable: Woodpecker 3.x passes the
# variables of a manual run to the steps only, never to a workflow's `when`.
# The message reaches `when` as CI_COMMIT_MESSAGE ("MANUAL: <message> @
# <branch>"). Rehearse on a branch other than develop: a manual run on develop
# also deploys staging through pipeline.yml.
#
# RUNNER_RELEASE_DRY_RUN=1 also stops a tag run before it publishes. It is read
# by the step shells, where variables do arrive.
#
# Nothing another pipeline wrote reaches the release (ADR-0053): no host cache
# is mounted, `bun install` starts from an empty cache in the step's container
# and keeps to bun.lock (--frozen-lockfile), and the release builds ignore
# turbo's cache. Only `ci-image` mounts the Docker socket.
#
# Pull requests never run this workflow. The gating in this file is not the
# security boundary: whoever pushes a commit can edit it. The boundary is in
# settings a pusher cannot change (deploy/README.md): the secrets
# github_release_token, npm_token and runner_signing_key are restricted to the
# tag event only, never manual, and runner-v* tags are protected by a GitHub
# ruleset and cut from main. A manual run therefore gets no secret: it builds
# and signs with a throwaway key.

when:
  - event: tag
    ref: refs/tags/runner-v*
  - event: manual
    evaluate: 'CI_COMMIT_MESSAGE contains "[runner-release]"'

variables:
  - &ci_image agentdock-ci:node-bun
  - &docker_image docker:28-cli
  - &turbo_env
    TURBO_TELEMETRY_DISABLED: '1'
  - &publish_when
    - event: tag
      ref: refs/tags/runner-v*

steps:
  # The same image pipeline.yml builds; built here too, so this workflow does
  # not depend on another one (pipeline.yml does not run on tags).
  - name: ci-image
    image: *docker_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --pull -t agentdock-ci:node-bun deploy/ci-image

  - name: install
    image: *ci_image
    environment: *turbo_env
    commands:
      - bun install --frozen-lockfile

  - name: test-runner
    image: *ci_image
    environment: *turbo_env
    commands:
      - bunx turbo run test --filter=@nautelle/runner

  # A tag run signs with the release key; build-release.sh fails without it.
  # TURBO_FORCE: the released binaries are built from source, never restored
  # from a cache entry.
  - name: build-release
    image: *ci_image
    when: *publish_when
    environment:
      <<: *turbo_env
      TURBO_FORCE: 'true'
      RUNNER_SIGNING_KEY:
        from_secret: runner_signing_key
    commands:
      - RUNNER_TAG="$${CI_COMMIT_TAG}" sh apps/runner/scripts/build-release.sh

  # A manual run has no tag and no secret: it signs with a throwaway key.
  - name: build-release-dry-run
    image: *ci_image
    when:
      - event: manual
    environment:
      <<: *turbo_env
      TURBO_FORCE: 'true'
    commands:
      - sh apps/runner/scripts/build-release.sh

  - name: github-release
    image: *ci_image
    when: *publish_when
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - if [ "$${RUNNER_RELEASE_DRY_RUN:-}" = 1 ]; then echo 'dry run, not publishing'; exit 0; fi
      - sh apps/runner/scripts/install-gh.sh
      - cd apps/runner/release
      - version=$${CI_COMMIT_TAG#runner-v}
      # A re-run finds the release and replaces its assets.
      - |
        if ! gh release view "$${CI_COMMIT_TAG}" --repo AndreyBegma/AgentDock >/dev/null 2>&1; then
          gh release create "$${CI_COMMIT_TAG}" --repo AndreyBegma/AgentDock --verify-tag \
            --title "nautelle-runner $${version}" \
            --notes "Install: brew install andreybegma/tap/nautelle-runner, or npm i -g nautelle-runner. Checksums: SHA256SUMS, signed by apps/runner/release-key.pub (SHA256SUMS.sig, Ed25519): openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig, then sha256sum -c --ignore-missing SHA256SUMS. Release and upgrade notes: https://github.com/AndreyBegma/AgentDock/blob/$${CI_COMMIT_TAG}/apps/runner/CHANGELOG.md"
        fi
      - gh release upload "$${CI_COMMIT_TAG}" --repo AndreyBegma/AgentDock --clobber nautelle-runner-*.tar.gz SHA256SUMS SHA256SUMS.sig

  - name: npm-publish
    image: *ci_image
    when: *publish_when
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - if [ "$${RUNNER_RELEASE_DRY_RUN:-}" = 1 ]; then echo 'dry run, not publishing'; exit 0; fi
      - npm config set //registry.npmjs.org/:_authToken "$${NPM_TOKEN}"
      - version=$${CI_COMMIT_TAG#runner-v}
      # Platform packages first: the wrapper's optionalDependencies name them.
      # The deprecated agentdock-runner depends on the wrapper, so it is last
      # (ADR-0073). A version already on the registry is skipped, so a re-run
      # resumes.
      - |
        for pkg in nautelle-runner-darwin-arm64 nautelle-runner-darwin-x64 nautelle-runner-linux-arm64 nautelle-runner-linux-x64 nautelle-runner agentdock-runner; do
          if npm view "$${pkg}@$${version}" version >/dev/null 2>&1; then
            echo "$${pkg}@$${version} is already published"
          else
            npm publish --access public "apps/runner/release/npm/$${pkg}"
          fi
        done
      - npm deprecate "agentdock-runner@$${version}" 'Renamed to nautelle-runner: npm i -g nautelle-runner (ADR-0073)'

  - name: homebrew-tap
    image: *ci_image
    when: *publish_when
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - if [ "$${RUNNER_RELEASE_DRY_RUN:-}" = 1 ]; then echo 'dry run, not publishing'; exit 0; fi
      - sh apps/runner/scripts/install-gh.sh
      - gh auth setup-git
      - version=$${CI_COMMIT_TAG#runner-v}
      - git clone --depth 1 https://github.com/AndreyBegma/homebrew-tap.git /tmp/tap
      - mkdir -p /tmp/tap/Formula
      - cp apps/runner/release/nautelle-runner.rb /tmp/tap/Formula/nautelle-runner.rb
      # ADR-0073: the tap renames the formula, so `brew upgrade` moves an
      # agentdock-runner install to nautelle-runner.
      - bun apps/runner/scripts/tap-rename.ts /tmp/tap
      - cd /tmp/tap
      - git config user.name 'Nautelle release'
      - git config user.email 'release@nautelle.invalid'
      - git add -A Formula formula_renames.json
      - git diff --cached --quiet || git commit -m "nautelle-runner $${version}"
      - git push origin HEAD
